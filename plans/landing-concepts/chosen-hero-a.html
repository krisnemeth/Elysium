<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0c0d;--bone:#ece8e1;--accent:#c0182f}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ink);color:var(--bone);font-family:'Josefin Sans',sans-serif}
svg{fill:currentColor}
.nav{position:fixed;inset:12px 16px auto;z-index:5;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 18px;max-width:1152px;margin:0 auto;border:1px solid rgb(236 232 225/.12);border-radius:16px;background:rgb(12 12 13/.55);backdrop-filter:blur(18px)}
.nav b{font-family:'Cormorant Garamond';font-size:24px;font-weight:500;letter-spacing:.02em}
.nav span{display:flex;gap:28px;font-size:13px;color:rgb(236 232 225/.7);align-items:center}
.nav i{font-style:normal;background:var(--accent);color:#fff;padding:7px 14px;border-radius:999px;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:rgb(236 232 225/.6)}
h1{font-family:'Cormorant Garamond';font-weight:400;line-height:.95;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600}
.primary{background:var(--bone);color:var(--ink)}
.ghost{border:1px solid rgb(236 232 225/.25)}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgb(236 232 225/.35),transparent)}
</style></head><body>
